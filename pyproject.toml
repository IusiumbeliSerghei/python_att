[project]
name = "quest"
version = "0.1.0"
description = "Текстовый квест с развилками, сохранением в sqlite и статистикой"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.scripts]
quest = "quest:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["quest"]

[tool.ruff]
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]
